[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "design-system-picker-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "watchfiles>=1.0.0",
    "httptools>=0.6.0",
    "pydantic[email]>=2.9.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "uuid6>=2024.1.12",
    "slowapi>=0.1.9",
    "aiofiles>=24.1.0",
    "jinja2>=3.1.4",
    "pillow>=10.4.0",
    # "weasyprint>=62.3",  # re-enable in Phase 5 (needs GTK/cairo on Windows)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
